name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incidentiq

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: pip install ruff && ruff check backend/

      - name: Run tests
        run: pip install pytest && pytest tests/ -v
        env:
          HINDSIGHT_API_URL: http://localhost:8888
          HINDSIGHT_API_KEY: test
          HINDSIGHT_BANK_ID: incidentiq-test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incidentiq/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
